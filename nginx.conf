server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # File names are stable between releases, so revalidate cached assets.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Navigation uses URL fragments (#journey, #demand, etc.).
    # Missing asset requests should return 404, not the HTML document.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }
}
